name: Development application

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-application.yml'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'apps/worker/**'
      - 'packages/database/**'
      - 'packages/graphql-schema/**'
      - 'deploy/workloads/application/**'
      - 'deploy/database/identity/**'
      - 'deploy/overlays/dev/application/**'
      - 'deploy/overlays/dev/application-database/**'
      - 'docs/deployment.md'
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform against development
        required: true
        default: plan
        type: choice
        options: [plan, deploy, status, diagnose]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'plan' && 'mymusiccoach-application-development' || format('mymusiccoach-application-validation-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'plan' }}

env:
  CLUSTER_NAME: mymusiccoach-dev
  EXPECTED_CONTEXT: do-ams3-mymusiccoach-dev
  NAMESPACE: mymusic-coach
  PUBLIC_URL: https://dev.mymusic.coach
  OIDC_ISSUER: https://auth-dev.mymusic.coach/realms/mymusic-coach

jobs:
  validate:
    name: Build and validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3
      - name: Render application targets
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/overlays/dev/application > "$RUNNER_TEMP/application.yaml"
          kubectl kustomize deploy/overlays/dev/application-database > "$RUNNER_TEMP/application-database.yaml"
          grep -Fq 'image: mymusiccoach/web:dev' "$RUNNER_TEMP/application.yaml"
          grep -Fq 'image: mymusiccoach/api:dev' "$RUNNER_TEMP/application.yaml"
          grep -Fq 'image: mymusiccoach/worker:dev' "$RUNNER_TEMP/application.yaml"
          grep -Fq 'kind: Job' "$RUNNER_TEMP/application-database.yaml"
          if grep -Eq '^[[:space:]]*kind:[[:space:]]+Secret[[:space:]]*$' "$RUNNER_TEMP/application.yaml" "$RUNNER_TEMP/application-database.yaml"; then
            echo 'Rendered manifests must not contain Secret resources.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*image:[[:space:]]+[^#[:space:]]+:latest([[:space:]]|$)' "$RUNNER_TEMP/application.yaml" "$RUNNER_TEMP/application-database.yaml"; then
            echo 'Rendered manifests must not use latest image tags.' >&2
            exit 1
          fi
          if grep -R -F 'https://auth.mymusic.coach' apps/web/src \
            --include='*.ts' --include='*.tsx' \
            --exclude='external-links.ts'; then
            echo 'Frontend components must derive Keycloak URLs from the configured issuer.' >&2
            exit 1
          fi
      - name: Build API image
        run: |
          set -euo pipefail
          docker build --file apps/api/Dockerfile --tag mymusiccoach-api:validation .
          image_bytes="$(docker image inspect mymusiccoach-api:validation --format '{{.Size}}')"
          max_bytes="$((450 * 1024 * 1024))"
          echo "API runtime image size: $((image_bytes / 1024 / 1024)) MiB"
          if (( image_bytes > max_bytes )); then
            echo 'API runtime image exceeds the 450 MiB development ceiling.' >&2
            exit 1
          fi
      - name: Build web image
        run: >-
          docker build
          --file apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_GRAPHQL_URL=/api/graphql
          --build-arg NEXT_PUBLIC_ENABLE_LIVE_API=true
          --build-arg NEXT_PUBLIC_KEYCLOAK_ISSUER="$OIDC_ISSUER"
          --build-arg NEXT_PUBLIC_APP_URL="$PUBLIC_URL"
          --tag mymusiccoach-web:validation
          .
      - name: Build worker image
        run: |
          set -euo pipefail
          docker build --file apps/worker/Dockerfile --tag mymusiccoach-worker:validation .
          image_bytes="$(docker image inspect mymusiccoach-worker:validation --format '{{.Size}}')"
          max_bytes="$((450 * 1024 * 1024))"
          echo "Worker runtime image size: $((image_bytes / 1024 / 1024)) MiB"
          if (( image_bytes > max_bytes )); then
            echo 'Worker runtime image exceeds the 450 MiB development ceiling.' >&2
            exit 1
          fi

  e2e-web:
    name: Web end-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the Playwright suite
        run: npm run test:e2e --workspace @my-music-coach/web
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  reconcile:
    name: Reconcile or inspect application
    needs: [validate, e2e-web]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation != 'plan'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Authenticate to the expected cluster
        shell: bash
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
          actual_context="$(kubectl config current-context)"
          test "$actual_context" = "$EXPECTED_CONTEXT" || {
            echo "Refusing context '$actual_context'; expected '$EXPECTED_CONTEXT'." >&2
            exit 1
          }
          kubectl get nodes >/dev/null
      - name: Verify application prerequisites
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "$NAMESPACE" >/dev/null
          kubectl -n "$NAMESPACE" get secret postgres-mymusiccoach keycloak-client-secrets >/dev/null
          kubectl -n "$NAMESPACE" get configmap postgres-ca >/dev/null
          kubectl -n "$NAMESPACE" get service keycloak >/dev/null
          for key in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD PGSSLMODE PGSSLROOTCERT; do
            test -n "$(kubectl -n "$NAMESPACE" get secret postgres-mymusiccoach -o "jsonpath={.data.${key}}")" || {
              echo "Secret postgres-mymusiccoach is missing '$key'." >&2
              exit 1
            }
          done
          test -n "$(kubectl -n "$NAMESPACE" get secret keycloak-client-secrets -o 'jsonpath={.data.WEB_CLIENT_SECRET}')"
      - name: Select or create the DigitalOcean registry
        id: registry
        if: inputs.operation == 'deploy'
        env:
          CONFIGURED_REGISTRY: ${{ vars.DOCR_REGISTRY }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t registries < <(doctl registries list --format Name --no-header | sed '/^[[:space:]]*$/d')
          registry_name="$CONFIGURED_REGISTRY"
          if [[ -z "$registry_name" && ${#registries[@]} -eq 1 ]]; then
            registry_name="${registries[0]}"
          elif [[ -z "$registry_name" && ${#registries[@]} -eq 0 ]]; then
            registry_name='ap13crow-mymusiccoach'
            doctl registries create "$registry_name" --subscription-tier starter --region ams3 >/dev/null
            echo "Created Starter registry '$registry_name' at no monthly charge."
          elif [[ -z "$registry_name" ]]; then
            echo 'More than one registry exists. Set development variable DOCR_REGISTRY.' >&2
            exit 1
          elif ! printf '%s\n' "${registries[@]}" | grep -Fxq "$registry_name"; then
            doctl registries create "$registry_name" --subscription-tier starter --region ams3 >/dev/null
            echo "Created configured Starter registry '$registry_name'."
          fi
          echo "name=$registry_name" >> "$GITHUB_OUTPUT"
          echo "repository=registry.digitalocean.com/$registry_name/mymusiccoach" >> "$GITHUB_OUTPUT"
      - name: Reclaim failed bootstrap image storage
        if: inputs.operation == 'deploy'
        env:
          REGISTRY_NAME: ${{ steps.registry.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          if kubectl -n "$NAMESPACE" get deployment/api >/dev/null 2>&1 \
            || kubectl -n "$NAMESPACE" get deployment/web >/dev/null 2>&1; then
            echo 'Application workloads exist; preserving bootstrap image tags.'
            exit 0
          fi

          failed_tags=(
            api-40c63d1f1a17508accd35002e12ee01f5b04f7f9
            web-40c63d1f1a17508accd35002e12ee01f5b04f7f9
            api-59055822ba256b017e3c7855345c21d1f7a8bd11
            web-59055822ba256b017e3c7855345c21d1f7a8bd11
          )
          mapfile -t existing_tags < <(
            doctl registry repository list-tags mymusiccoach \
              --registry "$REGISTRY_NAME" --format Tag --no-header \
              | sed '/^[[:space:]]*$/d'
          )
          deleted=0
          for tag in "${failed_tags[@]}"; do
            if printf '%s\n' "${existing_tags[@]}" | grep -Fxq "$tag"; then
              doctl registry repository delete-tag mymusiccoach "$tag" \
                --registry "$REGISTRY_NAME" --force
              deleted=$((deleted + 1))
            fi
          done
          if (( deleted == 0 )); then
            echo 'No completed bootstrap tags found; reclaiming orphaned push layers.'
          else
            echo "Removed $deleted failed bootstrap tag(s)."
          fi
          if doctl registry garbage-collection get-active "$REGISTRY_NAME" \
            --format Status --no-header >/dev/null 2>&1; then
            echo 'A registry garbage collection is already active; waiting for it.'
          else
            doctl registry garbage-collection start "$REGISTRY_NAME" \
              --include-untagged-manifests --force >/dev/null
          fi
          for attempt in $(seq 1 240); do
            if ! doctl registry garbage-collection get-active "$REGISTRY_NAME" \
              --format Status --no-header >/dev/null 2>&1; then
              echo 'Registry garbage collection completed.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out after 20 minutes waiting for registry garbage collection.' >&2
          exit 1
      - name: Build and push immutable application images
        id: images
        if: inputs.operation == 'deploy'
        env:
          REGISTRY_NAME: ${{ steps.registry.outputs.name }}
          REPOSITORY: ${{ steps.registry.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          doctl registries login "$REGISTRY_NAME" --expiry-seconds 1200
          api_image="$REPOSITORY:api-$GITHUB_SHA"
          web_image="$REPOSITORY:web-$GITHUB_SHA"
          worker_image="$REPOSITORY:worker-$GITHUB_SHA"
          push_failed=0
          docker buildx build --platform linux/amd64 --file apps/api/Dockerfile --tag "$api_image" --push . || push_failed=1
          if (( push_failed == 0 )); then
            docker buildx build --platform linux/amd64 --file apps/web/Dockerfile \
              --build-arg NEXT_PUBLIC_GRAPHQL_URL=/api/graphql \
              --build-arg NEXT_PUBLIC_ENABLE_LIVE_API=true \
              --build-arg NEXT_PUBLIC_KEYCLOAK_ISSUER="$OIDC_ISSUER" \
              --build-arg NEXT_PUBLIC_APP_URL="$PUBLIC_URL" \
              --tag "$web_image" --push . || push_failed=1
          fi
          if (( push_failed == 0 )); then
            docker buildx build --platform linux/amd64 --file apps/worker/Dockerfile --tag "$worker_image" --push . || push_failed=1
          fi
          if (( push_failed != 0 )); then
            echo 'The registry rejected an immutable application image.' >&2
            echo 'Current registry subscription and storage information:' >&2
            doctl registries list --format Name,SubscriptionTier,StorageUsageBytes,StorageUsageBytesUpdatedAt --no-header >&2 || true
            echo 'Current application tags:' >&2
            doctl registry repository list-tags mymusiccoach --registry "$REGISTRY_NAME" \
              --format Tag,UpdatedAt --no-header >&2 || true
            echo 'If this registry is on the 500 MiB Starter tier, upgrade it before retrying the deployment; live image tags cannot be deleted safely before their replacement is running.' >&2
            exit 1
          fi
          echo "api=$api_image" >> "$GITHUB_OUTPUT"
          echo "web=$web_image" >> "$GITHUB_OUTPUT"
          echo "worker=$worker_image" >> "$GITHUB_OUTPUT"
      - name: Integrate the registry with DOKS
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          doctl kubernetes cluster registry add "$CLUSTER_NAME"
      - name: Create stable runtime-only application secrets
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if kubectl -n "$NAMESPACE" get secret application-runtime >/dev/null 2>&1; then
            for key in JWT_SECRET NEXTAUTH_SECRET; do
              test -n "$(kubectl -n "$NAMESPACE" get secret application-runtime -o "jsonpath={.data.${key}}")" || {
                echo "Existing application-runtime Secret is missing '$key'." >&2
                exit 1
              }
            done
          else
            jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
            nextauth_secret="$(openssl rand -base64 48 | tr -d '\n')"
            kubectl -n "$NAMESPACE" create secret generic application-runtime \
              --from-literal=JWT_SECRET="$jwt_secret" \
              --from-literal=NEXTAUTH_SECRET="$nextauth_secret"
            unset jwt_secret nextauth_secret
            echo 'Created application runtime secrets inside Kubernetes.'
          fi
      - name: Synchronize configured integration secrets
        if: inputs.operation == 'deploy'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          # `kubectl apply` on a generated Secret replaces its whole data map,
          # so a run that only has (say) TICKETMASTER_API_KEY configured must
          # not wipe out Stripe keys synchronized by an earlier run. Merge:
          # this run's GitHub secret wins when present, otherwise fall back to
          # whatever's already in the cluster.
          existing_json="$(kubectl -n "$NAMESPACE" get secret application-integrations -o json 2>/dev/null || echo '{}')"
          existing_value() {
            local b64
            b64="$(echo "$existing_json" | jq -r --arg k "$1" '.data[$k] // empty')"
            if [[ -n "$b64" ]]; then echo "$b64" | base64 -d; fi
          }
          effective_stripe_secret_key="${STRIPE_SECRET_KEY:-$(existing_value STRIPE_SECRET_KEY)}"
          effective_stripe_webhook_secret="${STRIPE_WEBHOOK_SECRET:-$(existing_value STRIPE_WEBHOOK_SECRET)}"
          effective_ticketmaster_key="${TICKETMASTER_API_KEY:-$(existing_value TICKETMASTER_API_KEY)}"

          args=()
          if [[ -n "$effective_stripe_secret_key" && -n "$effective_stripe_webhook_secret" ]]; then
            args+=(--from-literal=STRIPE_SECRET_KEY="$effective_stripe_secret_key")
            args+=(--from-literal=STRIPE_WEBHOOK_SECRET="$effective_stripe_webhook_secret")
            echo 'Stripe credentials configured.'
          else
            echo 'Stripe remains disabled because one or both Stripe secrets are absent.'
          fi
          if [[ -n "$effective_ticketmaster_key" ]]; then
            args+=(--from-literal=TICKETMASTER_API_KEY="$effective_ticketmaster_key")
            echo 'Ticketmaster discovery configured.'
          else
            echo 'Ticketmaster discovery remains disabled because TICKETMASTER_API_KEY is absent.'
          fi

          if [[ ${#args[@]} -eq 0 ]]; then
            echo 'No integration secrets configured; leaving application-integrations untouched.'
            exit 0
          fi
          kubectl -n "$NAMESPACE" create secret generic application-integrations \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo 'Synchronized integration credentials without printing their values.'
      - name: Apply the identity schema
        id: schema
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" delete job application-identity-schema --ignore-not-found --wait=true
          kubectl -n "$NAMESPACE" apply -k deploy/overlays/dev/application-database
          kubectl -n "$NAMESPACE" wait --for=condition=complete --timeout=180s job/application-identity-schema
          kubectl -n "$NAMESPACE" logs job/application-identity-schema
      - name: Deploy immutable web, API, and worker images
        id: rollout
        if: inputs.operation == 'deploy'
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/application.yaml"
          kubectl kustomize deploy/overlays/dev/application > "$manifest"
          sed -i "s|mymusiccoach/api:dev|$API_IMAGE|g; s|mymusiccoach/web:dev|$WEB_IMAGE|g; s|mymusiccoach/worker:dev|$WORKER_IMAGE|g" "$manifest"
          grep -Fq "image: $API_IMAGE" "$manifest"
          grep -Fq "image: $WEB_IMAGE" "$manifest"
          grep -Fq "image: $WORKER_IMAGE" "$manifest"
          kubectl -n "$NAMESPACE" apply -f "$manifest"
          kubectl -n "$NAMESPACE" rollout status deployment/api --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/web --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/worker --timeout=300s
      - name: Verify internal services and public web route
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          ready_pod() {
            local app="$1"
            kubectl -n "$NAMESPACE" get pods -l "app.kubernetes.io/name=$app" -o json \
              | jq -r '.items[] | select(.status.phase == "Running" and any(.status.containerStatuses[]?; .ready)) | .metadata.name' \
              | head -n 1
          }
          api_pod="$(ready_pod api)"
          web_pod="$(ready_pod web)"
          worker_pod="$(ready_pod worker)"
          test -n "$api_pod" || { echo 'No Ready API Pod found.' >&2; exit 1; }
          test -n "$web_pod" || { echo 'No Ready web Pod found.' >&2; exit 1; }
          test -n "$worker_pod" || { echo 'No Ready worker Pod found.' >&2; exit 1; }
          kubectl -n "$NAMESPACE" exec "$api_pod" -- node -e "fetch('http://127.0.0.1:4000/health/ready').then(async r=>{if(!r.ok)throw Error(await r.text())})"
          kubectl -n "$NAMESPACE" exec "$web_pod" -- node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{if(!r.ok)throw Error(await r.text())})"
          kubectl -n "$NAMESPACE" exec "$worker_pod" -- node -e "fetch('http://127.0.0.1:4100/health/ready').then(async r=>{if(!r.ok)throw Error(await r.text())})"
          providers="$RUNNER_TEMP/providers.json"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$PUBLIC_URL/api/health" >/dev/null \
              && curl --fail --silent --show-error "$PUBLIC_URL/api/auth/providers" > "$providers" \
              && jq -e '.keycloak.type == "oauth"' "$providers" >/dev/null; then
              echo 'Public web health and Keycloak provider discovery succeeded.'
              exit 0
            fi
            sleep 2
          done
          echo 'The public Cloudflare route did not reach the ready web service.' >&2
          exit 1
      - name: Diagnose authenticated profile provisioning
        if: inputs.operation == 'diagnose'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Current immutable images:'
          kubectl -n "$NAMESPACE" get deployment api web worker -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas'
          echo 'Identity schema objects:'
          db_pod="$(kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=api -o json | jq -r '.items[] | select(.status.phase == "Running") | .metadata.name' | head -n 1)"
          test -n "$db_pod" || {
            echo 'No running API Pod was found.' >&2
            exit 1
          }
          echo 'Recent API logs (bearer tokens redacted):'
          kubectl -n "$NAMESPACE" logs "$db_pod" --since=6h --tail=500 \
            | sed -E 's/Bearer[[:space:]]+[A-Za-z0-9._~-]+/Bearer [REDACTED]/g' \
            || true
          echo 'API environment contract (values are not printed):'
          kubectl -n "$NAMESPACE" exec "$db_pod" -- node -e \
            "for (const key of ['PGHOST','PGPORT','PGDATABASE','PGUSER','PGPASSWORD','PGSSLROOTCERT','KEYCLOAK_ISSUER','KEYCLOAK_CLIENT_ID']) console.log(key + '=' + (process.env[key] ? 'configured' : 'missing'))"
          echo 'Database readiness from the running API process:'
          kubectl -n "$NAMESPACE" exec "$db_pod" -- node -e \
            "fetch('http://127.0.0.1:4000/health/ready').then(async r => { console.log(await r.text()); if (!r.ok) process.exit(1) })"
          echo 'Keycloak JWKS reachability from the API Pod:'
          kubectl -n "$NAMESPACE" exec "$db_pod" -- node -e \
            "fetch(process.env.KEYCLOAK_ISSUER + '/protocol/openid-connect/certs').then(async r => { const body = await r.json(); console.log('status=' + r.status + ' keys=' + (Array.isArray(body.keys) ? body.keys.length : 0)); if (!r.ok || !Array.isArray(body.keys) || body.keys.length === 0) process.exit(1) })"
          echo 'Public health:'
          curl --fail --silent --show-error "$PUBLIC_URL/api/health"

      - name: Report application status
        if: always()
        shell: bash
        run: |
          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then exit 0; fi
          kubectl -n "$NAMESPACE" get deployment,service,pod -l app.kubernetes.io/part-of=mymusic-coach -o wide || true
          kubectl -n "$NAMESPACE" get networkpolicy api-ingress web-ingress 2>/dev/null || true
          kubectl -n "$NAMESPACE" top pod -l app.kubernetes.io/part-of=mymusic-coach 2>/dev/null || true
          curl --fail --silent "$PUBLIC_URL/api/health" || true
      - name: Diagnose deployment failure
        if: always() && inputs.operation == 'deploy' && (steps.schema.outcome == 'failure' || steps.rollout.outcome == 'failure')
        shell: bash
        run: |
          kubectl -n "$NAMESPACE" get pods,jobs -o wide || true
          kubectl -n "$NAMESPACE" logs job/application-identity-schema --all-containers=true || true
          kubectl -n "$NAMESPACE" logs deployment/api --tail=150 || true
          kubectl -n "$NAMESPACE" logs deployment/web --tail=150 || true
          kubectl -n "$NAMESPACE" logs deployment/worker --tail=150 || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 100 || true
