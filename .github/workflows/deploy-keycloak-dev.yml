name: Development Keycloak

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-keycloak-dev.yml'
      - 'deploy/operators/keycloak/**'
      - 'deploy/workloads/keycloak/**'
      - 'deploy/overlays/dev/keycloak/**'
      - 'deploy/overlays/dev/keycloak-realm/**'
      - 'deploy/README.md'
      - 'docs/deployment.md'
      - 'docs/development.md'
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to perform for development Keycloak
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
          - status

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.operation != 'plan' &&
    'mymusiccoach-development' || format('mymusiccoach-keycloak-validation-{0}', github.ref) }}
  cancel-in-progress: >-
    ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'plan' }}

env:
  CLUSTER_NAME: mymusiccoach-dev
  EXPECTED_CONTEXT: do-ams3-mymusiccoach-dev
  NAMESPACE: mymusic-coach
  OIDC_ISSUER: https://auth-dev.mymusic.coach/realms/mymusic-coach
  OIDC_DISCOVERY_URL: https://auth-dev.mymusic.coach/realms/mymusic-coach/.well-known/openid-configuration
  REALM_IMPORT: mymusiccoach-dev-realm
  CLIENT_SECRET_NAME: keycloak-client-secrets

jobs:
  validate:
    name: Render and validate Keycloak manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - name: Render pinned Keycloak operator
        run: kubectl kustomize deploy/operators/keycloak > "$RUNNER_TEMP/keycloak-operator.yaml"

      - name: Render development Keycloak workload
        run: kubectl kustomize deploy/overlays/dev/keycloak > "$RUNNER_TEMP/keycloak.yaml"

      - name: Render development realm bootstrap
        run: kubectl kustomize deploy/overlays/dev/keycloak-realm > "$RUNNER_TEMP/keycloak-realm.yaml"

      - name: Enforce manifest safety constraints
        shell: bash
        run: |
          set -euo pipefail
          manifests=("$RUNNER_TEMP/keycloak-operator.yaml" "$RUNNER_TEMP/keycloak.yaml" "$RUNNER_TEMP/keycloak-realm.yaml")

          if grep -Fq 'my-music-coach' "${manifests[@]}"; then
            echo "Rendered Keycloak manifests target the obsolete namespace 'my-music-coach'; use 'mymusic-coach'." >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*kind:[[:space:]]+Secret[[:space:]]*$' "${manifests[@]}"; then
            echo "Rendered manifests must not contain Kubernetes Secret resources." >&2
            exit 1
          fi

          if grep -Eq '^[[:space:]]*image:[[:space:]]+[^#[:space:]]+:latest([[:space:]]|$)' "${manifests[@]}"; then
            echo "Rendered manifests must not use mutable latest image tags." >&2
            exit 1
          fi

          grep -Fq 'name: db-tls-mode' "$RUNNER_TEMP/keycloak.yaml"
          grep -Fq 'value: verify-server' "$RUNNER_TEMP/keycloak.yaml"
          grep -Fq 'enabled: false' "$RUNNER_TEMP/keycloak.yaml"
          grep -Fq 'hostname: https://auth-dev.mymusic.coach' "$RUNNER_TEMP/keycloak.yaml"
          grep -Fq 'headers: xforwarded' "$RUNNER_TEMP/keycloak.yaml"
          grep -Fq 'kind: KeycloakRealmImport' "$RUNNER_TEMP/keycloak-realm.yaml"
          grep -Fq 'realm: mymusic-coach' "$RUNNER_TEMP/keycloak-realm.yaml"
          grep -Fq 'clientId: mymusic-coach-web' "$RUNNER_TEMP/keycloak-realm.yaml"
          grep -Fq 'secret: ${WEB_CLIENT_SECRET}' "$RUNNER_TEMP/keycloak-realm.yaml"
          grep -Fq 'memory: 256Mi' "$RUNNER_TEMP/keycloak-realm.yaml"

  reconcile:
    name: Reconcile or inspect development Keycloak
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation != 'plan'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate to the expected cluster
        shell: bash
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save "$CLUSTER_NAME"
          actual_context="$(kubectl config current-context)"
          test "$actual_context" = "$EXPECTED_CONTEXT" || {
            echo "Refusing to continue: expected context '$EXPECTED_CONTEXT', got '$actual_context'." >&2
            exit 1
          }
          kubectl get nodes >/dev/null

      - name: Verify foundation prerequisites
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          kubectl get namespace "$NAMESPACE" >/dev/null
          kubectl -n "$NAMESPACE" get secret postgres-keycloak >/dev/null
          kubectl -n "$NAMESPACE" get configmap postgres-ca >/dev/null

          for key in PGHOST PGPORT PGUSER PGPASSWORD; do
            value="$(kubectl -n "$NAMESPACE" get secret postgres-keycloak -o "jsonpath={.data.${key}}")"
            test -n "$value" || {
              echo "Secret postgres-keycloak is missing required key '$key'." >&2
              exit 1
            }
          done

          ca_data="$(kubectl -n "$NAMESPACE" get configmap postgres-ca -o 'jsonpath={.data.ca\.crt}')"
          test -n "$ca_data" || {
            echo "ConfigMap postgres-ca is missing required key 'ca.crt'." >&2
            exit 1
          }

      - name: Install the pinned Keycloak operator
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --server-side --field-manager=mymusiccoach-deploy -k deploy/operators/keycloak
          kubectl -n "$NAMESPACE" rollout status deployment/keycloak-operator --timeout=300s

      - name: Reconcile Keycloak and wait for readiness
        id: keycloak
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k deploy/overlays/dev/keycloak
          kubectl -n "$NAMESPACE" wait \
            --for=condition=Ready \
            --timeout=600s \
            keycloak/keycloak
          kubectl -n "$NAMESPACE" rollout status statefulset/keycloak --timeout=600s

          service_type="$(kubectl -n "$NAMESPACE" get service keycloak -o jsonpath='{.spec.type}')"
          test "$service_type" = "ClusterIP" || {
            echo "Refusing unexpected Keycloak Service type '$service_type'." >&2
            exit 1
          }

          if kubectl -n "$NAMESPACE" get ingress keycloak-ingress >/dev/null 2>&1; then
            echo "Keycloak ingress exists even though this increment must remain internal." >&2
            exit 1
          fi

      - name: Verify the management readiness endpoint
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          port_forward_log="$RUNNER_TEMP/keycloak-port-forward.log"
          kubectl -n "$NAMESPACE" port-forward service/keycloak 19000:9000 >"$port_forward_log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:19000/health/ready >/dev/null; then
              echo "Keycloak readiness endpoint returned success."
              exit 0
            fi
            sleep 2
          done

          cat "$port_forward_log" >&2
          echo "Keycloak readiness endpoint did not return success." >&2
          exit 1

      - name: Bootstrap development realm
        id: realm
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          set +x

          check_realm() {
            local port_forward_log="$RUNNER_TEMP/keycloak-realm-port-forward.log"
            kubectl -n "$NAMESPACE" port-forward service/keycloak 19080:8080 >"$port_forward_log" 2>&1 &
            local port_forward_pid=$!

            for attempt in $(seq 1 30); do
              if curl --fail --silent \
                -H 'Host: auth-dev.mymusic.coach' \
                -H 'X-Forwarded-Host: auth-dev.mymusic.coach' \
                -H 'X-Forwarded-Proto: https' \
                -H 'X-Forwarded-Port: 443' \
                http://127.0.0.1:19080/realms/mymusic-coach/.well-known/openid-configuration \
                >/dev/null 2>&1; then
                kill "$port_forward_pid" 2>/dev/null || true
                wait "$port_forward_pid" 2>/dev/null || true
                return 0
              fi
              sleep 1
            done

            kill "$port_forward_pid" 2>/dev/null || true
            wait "$port_forward_pid" 2>/dev/null || true
            return 1
          }

          if check_realm; then
            client_secret_data="$(kubectl -n "$NAMESPACE" get secret "$CLIENT_SECRET_NAME" \
              -o 'jsonpath={.data.WEB_CLIENT_SECRET}' 2>/dev/null || true)"
            test -n "$client_secret_data" || {
              echo "Realm exists, but Secret '$CLIENT_SECRET_NAME' is missing WEB_CLIENT_SECRET. Refusing to generate a mismatched replacement." >&2
              exit 1
            }
            echo "Realm mymusic-coach already exists; bootstrap is idempotently skipped."
            exit 0
          fi

          if ! kubectl -n "$NAMESPACE" get secret "$CLIENT_SECRET_NAME" >/dev/null 2>&1; then
            client_secret="$(openssl rand -base64 48 | tr -d '\n')"
            kubectl -n "$NAMESPACE" create secret generic "$CLIENT_SECRET_NAME" \
              --from-literal=WEB_CLIENT_SECRET="$client_secret" \
              --dry-run=client -o yaml | kubectl apply -f -
            unset client_secret
            echo "Generated the development OIDC client Secret inside Kubernetes."
          fi

          client_secret_data="$(kubectl -n "$NAMESPACE" get secret "$CLIENT_SECRET_NAME" \
            -o 'jsonpath={.data.WEB_CLIENT_SECRET}')"
          test -n "$client_secret_data" || {
            echo "Secret '$CLIENT_SECRET_NAME' is missing WEB_CLIENT_SECRET." >&2
            exit 1
          }

          kubectl -n "$NAMESPACE" delete keycloakrealmimport "$REALM_IMPORT" \
            --ignore-not-found --wait=true
          kubectl apply -k deploy/overlays/dev/keycloak-realm

          if ! kubectl -n "$NAMESPACE" wait \
            --for=condition=Done \
            --timeout=600s \
            "keycloakrealmimport/$REALM_IMPORT"; then
            kubectl -n "$NAMESPACE" get keycloakrealmimport "$REALM_IMPORT" -o yaml || true
            kubectl -n "$NAMESPACE" get jobs,pods -l app.kubernetes.io/component=realm-bootstrap -o wide || true
            exit 1
          fi

          check_realm || {
            echo "Realm import completed, but internal OIDC discovery is unavailable." >&2
            exit 1
          }

          kubectl -n "$NAMESPACE" delete keycloakrealmimport "$REALM_IMPORT" --wait=true
          echo "Realm bootstrap completed and its one-shot import resources were cleaned up."

      - name: Verify public OIDC discovery through Cloudflare
        if: inputs.operation == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          discovery_file="$RUNNER_TEMP/openid-configuration.json"
          curl_error_file="$RUNNER_TEMP/openid-configuration.curl-error"
          oidc_host="${OIDC_DISCOVERY_URL#https://}"
          oidc_host="${oidc_host%%/*}"
          http_code="000"

          for attempt in $(seq 1 30); do
            : >"$curl_error_file"
            http_code="$(curl --ipv4 --silent --show-error \
              --connect-timeout 5 \
              --max-time 15 \
              --output "$discovery_file" \
              --write-out '%{http_code}' \
              "$OIDC_DISCOVERY_URL" 2>"$curl_error_file" || true)"

            if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              issuer="$(jq -er '.issuer' "$discovery_file")"
              test "$issuer" = "$OIDC_ISSUER" || {
                echo "Unexpected public issuer '$issuer'; expected '$OIDC_ISSUER'." >&2
                exit 1
              }
              echo "Public OIDC discovery is reachable with the expected issuer."
              exit 0
            fi

            if (( attempt == 1 || attempt % 10 == 0 )); then
              echo "Public OIDC attempt $attempt returned HTTP $http_code." >&2
              cat "$curl_error_file" >&2
            fi
            sleep 2
          done

          echo "Public OIDC discovery did not become reachable through Cloudflare." >&2
          echo "IPv4 DNS resolution for $oidc_host:" >&2
          getent ahostsv4 "$oidc_host" >&2 || true
          echo "Last curl error (HTTP $http_code):" >&2
          cat "$curl_error_file" >&2
          if test -s "$discovery_file"; then
            echo "Response preview:" >&2
            head -c 512 "$discovery_file" >&2
            echo >&2
          fi
          exit 1

      - name: Report Keycloak status and resource use
        if: always()
        shell: bash
        run: |
          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "Namespace '$NAMESPACE' does not exist."
            exit 0
          fi

          kubectl -n "$NAMESPACE" get keycloak keycloak -o wide 2>/dev/null || true
          kubectl -n "$NAMESPACE" get deployment/keycloak-operator statefulset/keycloak 2>/dev/null || true
          kubectl -n "$NAMESPACE" get service/keycloak networkpolicy/keycloak-network-policy 2>/dev/null || true
          kubectl -n "$NAMESPACE" get pods -l app=keycloak -o wide 2>/dev/null || true

          if curl --fail --silent "$OIDC_DISCOVERY_URL" >/dev/null 2>&1; then
            echo "Public OIDC discovery is reachable."
          else
            echo "Public OIDC discovery is not reachable."
          fi

          if ! kubectl -n "$NAMESPACE" top pods -l app=keycloak; then
            echo "Pod metrics are not available yet; readiness is reported separately."
          fi

      - name: Diagnose a failed Keycloak reconciliation
        if: always() && inputs.operation == 'deploy' && steps.keycloak.outcome == 'failure'
        shell: bash
        run: |
          kubectl -n "$NAMESPACE" get keycloak keycloak -o yaml || true
          kubectl -n "$NAMESPACE" describe keycloak keycloak || true
          kubectl -n "$NAMESPACE" describe statefulset keycloak || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 100 || true

      - name: Diagnose a failed realm bootstrap
        if: always() && inputs.operation == 'deploy' && steps.realm.outcome == 'failure'
        shell: bash
        run: |
          kubectl -n "$NAMESPACE" get keycloakrealmimport "$REALM_IMPORT" -o yaml || true
          kubectl -n "$NAMESPACE" get jobs,pods -l app.kubernetes.io/component=realm-bootstrap -o wide || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 100 || true
