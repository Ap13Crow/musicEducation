# ── Queries ──────────────────────

type Query {
  # Auth
  me: User

  # Users
  user(id: ID, username: String): User
  searchUsers(query: String!, role: Role, page: Int, limit: Int): UserConnection!
  teachers(filter: TeacherFilterInput, page: Int, limit: Int): TeacherConnection!
  teacher(id: ID!): TeacherProfile
  myTeacherApplication: TeacherApplication
  # Admin review queue for "Become a teacher" submissions.
  teacherApplications(status: TeacherApplicationStatus, page: Int, limit: Int): [TeacherApplication!]!

  # Courses
  courses(filter: CourseFilterInput, page: Int, limit: Int): CourseConnection!
  course(id: ID, slug: String): Course
  myCourses(page: Int, limit: Int): CourseConnection!
  myEnrollments(page: Int, limit: Int): EnrollmentConnection!
  myEnrollment(courseId: ID!): Enrollment
  # Enrolled students for a course, for the owning teacher/admin - powers the
  # course builder's Students panel (award bonus XP).
  courseEnrollments(courseId: ID!, page: Int, limit: Int): EnrollmentConnection!
  myQuizAttempt(lessonId: ID!): QuizAttempt
  categories: [Category!]!

  # Bookings
  myBookings(status: BookingStatus, page: Int, limit: Int): [Booking!]!
  booking(id: ID!): Booking
  teacherAvailability(teacherProfileId: ID!, date: DateTime): [TeacherAvailability!]!
  # Bounded by [from, to] like every other calendar query here - never an
  # unbounded scan. Public: any signed-in caller can see a teacher's blocks
  # (label + times only, never `note`) to know when not to try booking.
  teacherUnavailability(teacherProfileId: ID!, from: DateTime!, to: DateTime!): [TeacherUnavailability!]!
  # The caller's own private appointments only - bounded range required so
  # a personal-calendar view can't turn into an unbounded query.
  myAppointments(from: DateTime!, to: DateTime!): [PersonalAppointment!]!

  # Calendar sync (Phase 6, scoped - see ExternalCalendarConnection above)
  myExternalCalendarConnections: [ExternalCalendarConnection!]!
  # Null until rotateCalendarFeedToken has been called once.
  myCalendarFeedToken: String

  # Events
  events(filter: EventFilterInput, page: Int, limit: Int): EventConnection!
  event(id: ID, slug: String): Event
  nearbyEvents(latitude: Float!, longitude: Float!, radiusKm: Float!, page: Int, limit: Int): EventConnection!
  myEventBookings(page: Int, limit: Int): [EventBooking!]!
  myEvents(page: Int, limit: Int): EventConnection!

  # External event discovery (Ticketmaster now, Classictic later) — read-only,
  # clearly attributed, links out via `url`. Never enters authored Event flows.
  externalEvents(filter: ExternalEventFilterInput, page: Int, limit: Int): ExternalEventConnection!
  # Upcoming external events matching the caller's own instrument/music-style
  # preferences (DeepSeek-classified) - the events page's "Recommended for
  # you" strip. Empty for a signed-out caller or one with no preferences set.
  recommendedExternalEvents(limit: Int): [ExternalEventProjection!]!
  # The caller's own "recently visited" external events, most recent first -
  # see recordExternalEventView. Each row also carries attendance-confirm and
  # XP-award state for the confirm/evaluate/credit flow.
  myRecentlyViewedExternalEvents(limit: Int): [ExternalEventEngagement!]!

  # Assessments
  assessmentQuestions(category: String, difficulty: String, instrument: String, limit: Int): [AssessmentQuestion!]!
  myAssessments: [Assessment!]!

  # XP ledger — audits every grant outside per-lesson/assessment completion.
  myXpAwards: [XpAward!]!
  # Configured min/max for teacher/admin-awarded course bonus XP.
  xpAwardBounds: XpAwardBounds!

  # Feed
  feed(page: Int, limit: Int): FeedPostConnection!
  feedPost(id: ID!): FeedPost

  # Reviews
  reviews(courseId: ID, eventId: ID, bookingId: ID, page: Int, limit: Int): ReviewConnection!

  # Student availability (self-declaration)
  myAvailability: [StudentAvailability!]!

  # Lesson packages / subscriptions (Phase 5). Directory queries return
  # published offers only unless the caller owns the teacher profile or is
  # an admin.
  teacherPackageOffers(teacherProfileId: ID!): [LessonPackageOffer!]!
  teacherSubscriptionOffers(teacherProfileId: ID!): [SubscriptionOffer!]!
  myPackagePurchases: [LessonPackagePurchase!]!
  mySubscriptionPurchases: [SubscriptionPurchase!]!

  # Admin
  adminStats: AdminStats!
  adminSettings: [AdminSetting!]!
  adminUsers(role: Role, search: String, page: Int, limit: Int): [User!]!
  # Transactional-email delivery queue, most recent first - ADMIN only. A
  # non-empty DEAD_LETTER filter is the "notifications are silently
  # failing" signal this exists for.
  mailOutbox(status: MailOutboxStatus, limit: Int): [MailOutboxMessage!]!

  # Object storage - false when S3_* isn't configured, so callers can hide
  # upload UI rather than let requestUploadUrl fail.
  storageConfigured: Boolean!

  # Public homepage counters - real counts, no auth required.
  platformStats: PlatformStats!

  # The caller's own Stripe Connect payout status, fetched live - see
  # StripeConnectStatus. TEACHER/ADMIN only, same as
  # createStripeConnectOnboardingLink.
  stripeConnectStatus: StripeConnectStatus!
}

# ── Mutations ───────────────────────

type Mutation {
  # Auth
  register(input: RegisterInput!): AuthPayload!
  login(email: String!, password: String!): AuthPayload!
  logout: Boolean!
  refreshToken(token: String!): AuthPayload!
  requestPasswordReset(email: String!): Boolean!
  resetPassword(token: String!, newPassword: String!): Boolean!
  verifyEmail(token: String!): Boolean!

  # Users
  updateProfile(input: UpdateProfileInput!): User!
  applyAsTeacher(input: ApplyAsTeacherInput): TeacherProfile!
  # "Become a teacher" self-service application — pending until an admin
  # calls reviewTeacherApplication. Re-submitting after a rejection is allowed.
  applyForTeacher(input: TeacherApplicationInput!): TeacherApplication!
  reviewTeacherApplication(id: ID!, approve: Boolean!): TeacherApplication!
  updateTeacherProfile(
    headline: String
    teachingBio: String
    hourlyRate: Float
    instruments: [String!]
    specializations: [String!]
    teachingFormats: [String!]
    isAvailable: Boolean
    calendlyUsername: String
    # Show/hide the intro video copied from the approved application - the
    # teacher's own call, per the product decision that they decide whether
    # it's public. The link itself is kept either way.
    introVideoVisible: Boolean
    # Must be a URL requestUploadUrl(purpose: TEACHER_PROFILE_IMAGE) actually
    # minted for this teacher - pass null to remove the current image.
    publicImageUrl: String
    # Booking governance (Phase 4) - leadDays 0-7, cancellationDays 2-7,
    # cancellationDays >= leadDays + 1 (enforced server-side; see
    # apps/api/src/lib/bookingPolicy.ts). Both validated together whenever
    # either is sent, against whichever value isn't being changed.
    leadDays: Int
    cancellationDays: Int
    autoApproveNewStudents: Boolean
    autoApproveRecurringStudents: Boolean
  ): TeacherProfile!
  # maxActiveStudents null clears the cap (unlimited); pass 0 for a real
  # zero-capacity cap, never treated as "no cap set."
  setInstrumentCapacity(instrument: String!, maxActiveStudents: Int): TeacherInstrumentCapacity!
  addCertification(title: String!, issuingBody: String, issuedYear: Int, documentUrl: String): TeacherCertification!
  setAvailability(slots: [AvailabilitySlotInput!]!): [TeacherAvailability!]!
  createUnavailability(startsAt: DateTime!, endsAt: DateTime!, label: UnavailabilityLabel!, note: String): TeacherUnavailability!
  deleteUnavailability(id: ID!): Boolean!

  # Personal calendar - every authenticated user, not just teachers.
  createAppointment(title: String!, startsAt: DateTime!, endsAt: DateTime!, notes: String): PersonalAppointment!
  updateAppointment(id: ID!, title: String, startsAt: DateTime, endsAt: DateTime, notes: String): PersonalAppointment!
  deleteAppointment(id: ID!): Boolean!

  # Calendar sync (Phase 6, scoped) - connectExternalCalendar always
  # rejects with NOT_CONFIGURED today (see ExternalCalendarConnection's
  # schema comment above). rotateCalendarFeedToken is the working feature:
  # get-or-rotate the caller's personal ICS subscription-feed token.
  connectExternalCalendar(provider: ExternalCalendarProvider!): ExternalCalendarConnection!
  disconnectExternalCalendar(provider: ExternalCalendarProvider!): Boolean!
  rotateCalendarFeedToken: String!

  # Student availability self-declaration
  setStudentAvailability(slots: [AvailabilitySlotInput!]!): [StudentAvailability!]!

  completeOnboarding: User!
  followUser(userId: ID!): User!
  unfollowUser(userId: ID!): User!

  # Object storage - obtain a short-lived presigned PUT URL, upload directly
  # to it client-side, then pass the returned fileUrl into applyForTeacher /
  # addLessonSlide. Throws if S3_* isn't configured (see storageConfigured).
  requestUploadUrl(purpose: UploadPurpose!, filename: String!, contentType: String!): UploadTarget!

  # Courses
  createCourse(input: CreateCourseInput!): Course!
  updateCourse(id: ID!, input: UpdateCourseInput!): Course!
  publishCourse(id: ID!): Course!
  archiveCourse(id: ID!): Course!
  createSection(input: CreateSectionInput!): CourseSection!
  updateSection(id: ID!, input: UpdateSectionInput!): CourseSection!
  deleteSection(id: ID!): Boolean!
  createLesson(input: CreateLessonInput!): Lesson!
  updateLesson(id: ID!, input: UpdateLessonInput!): Lesson!
  deleteLesson(id: ID!): Boolean!
  enrollInCourse(courseId: ID!): Enrollment!
  markLessonComplete(lessonId: ID!): LessonProgress!
  createQuizQuestion(input: CreateQuizQuestionInput!): QuizQuestion!
  updateQuizQuestion(id: ID!, input: UpdateQuizQuestionInput!): QuizQuestion!
  deleteQuizQuestion(id: ID!): Boolean!
  startQuizAttempt(lessonId: ID!): QuizAttempt!
  submitQuizAnswer(input: SubmitQuizAnswerInput!): QuizAnswer!
  completeQuizAttempt(attemptId: ID!): QuizAttempt!
  # Slide deck management (contentType SLIDES) - fileUrl comes from a prior
  # requestUploadUrl(purpose: COURSE_SLIDE) round trip.
  addLessonSlide(input: AddLessonSlideInput!): LessonSlide!
  reorderLessonSlides(lessonId: ID!, slideIds: [ID!]!): [LessonSlide!]!
  deleteLessonSlide(id: ID!): Boolean!
  # Records that the current student viewed one slide - idempotent, drives
  # myViewedSlideIds. Does not itself complete the lesson; call
  # markLessonComplete once every slide has been viewed.
  viewLessonSlide(slideId: ID!): Boolean!

  # Bookings
  bookSession(input: BookSessionInput!): Booking!
  confirmBooking(bookingId: ID!): Booking!
  cancelBooking(bookingId: ID!): Booking!
  createZoomMeeting(bookingId: ID!): ZoomMeetingInfo!

  # Events
  createEvent(input: CreateEventInput!): Event!
  updateEvent(id: ID!, input: UpdateEventInput!): Event!
  publishEvent(id: ID!): Event!
  bookEvent(eventId: ID!): EventBooking!
  cancelEventBooking(bookingId: ID!): EventBooking!

  # Assessments
  startAssessment: Assessment!
  submitAssessmentAnswer(input: SubmitAssessmentAnswerInput!): AssessmentAnswer!
  completeAssessment(assessmentId: ID!): Assessment!

  # XP — teacher/admin-awarded course bonus, bounded by xpAwardBounds.
  awardCourseXp(enrollmentId: ID!, amount: Int!, note: String): XpAward!

  # Feed
  createFeedPost(input: CreateFeedPostInput!): FeedPost!
  likeFeedPost(postId: ID!): FeedPost!
  unlikeFeedPost(postId: ID!): FeedPost!
  commentOnPost(postId: ID!, body: String!): FeedComment!

  # Reviews
  createReview(input: CreateReviewInput!): Review!

  # External event engagement (recently visited -> confirm participation ->
  # evaluate via createReview -> XP credited). See discovery.ts.
  recordExternalEventView(id: ID!): ExternalEventEngagement!
  confirmExternalEventAttendance(id: ID!): ExternalEventEngagement!

  # Payments
  # type also accepts "package" and "subscription" (refId = the offer id) -
  # see LessonPackageOffer/SubscriptionOffer.
  createCheckoutSession(type: String!, refId: ID!, provider: PaymentProvider): CheckoutSession!
  # Teacher payouts — creates (once) a Stripe Connect Express account for the
  # calling teacher and returns a fresh hosted onboarding link.
  createStripeConnectOnboardingLink: StripeConnectLink!

  # Lesson packages / subscriptions (Phase 5)
  createPackageOffer(instrument: String, lessonCount: Int!, pricePerPackage: Float!, currency: String): LessonPackageOffer!
  updatePackageOffer(id: ID!, pricePerPackage: Float, isPublished: Boolean): LessonPackageOffer!
  # Refuses to delete an offer with existing purchases - unpublish instead;
  # existing purchases keep their snapshotted terms regardless either way.
  deletePackageOffer(id: ID!): Boolean!
  createSubscriptionOffer(includedHoursPerMonth: Int!, termMonths: Int!, monthlyPrice: Float!, currency: String, includedCourseIds: [ID!]): SubscriptionOffer!
  updateSubscriptionOffer(id: ID!, monthlyPrice: Float, includedCourseIds: [ID!], isPublished: Boolean): SubscriptionOffer!
  deleteSubscriptionOffer(id: ID!): Boolean!
  # Takes effect immediately (no proration - see apps/api/src/lib/pricing.ts).
  cancelSubscription(id: ID!): SubscriptionPurchase!

  # Admin
  updateAdminSetting(key: String!, value: String!): AdminSetting!
  adminBanUser(userId: ID!): User!
  adminSetRole(userId: ID!, role: Role!): User!
  # Re-queues a DEAD_LETTER (or still-FAILED) message for immediate retry -
  # resets attempts to 0 and nextAttemptAt to now, so the next mail-dispatch
  # tick picks it up. Use once the underlying cause (e.g. SMTP_PASSWORD) is
  # actually fixed; retrying blindly just repeats the same failure.
  retryMailOutboxMessage(id: ID!): MailOutboxMessage!
}
