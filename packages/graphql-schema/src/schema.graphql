# A student's self-service request to become a teacher — reviewed by an
# admin (reviewTeacherApplication) before role promotion, rather than
# changing on submission.
type TeacherApplication {
  id: ID!
  userId: ID!
  headline: String
  bio: String
  instruments: [String!]!
  experienceYears: Int
  address: String
  birthdate: DateTime
  # Private - admin review only, never copied onto the public TeacherProfile.
  gender: String
  motivation: String
  # Populated via requestUploadUrl(purpose: TEACHER_APPLICATION_*) then
  # attached here on submit - object storage, never inline file data.
  cvUrl: String
  audioSampleUrl: String
  documentUrls: [String!]!
  # Public teacher photo, via requestUploadUrl(purpose:
  # TEACHER_PROFILE_IMAGE) - copied to TeacherProfile.publicImageUrl on
  # approval. Deliberately separate from the account avatar.
  imageUrl: String
  # YouTube link, required to apply - copied to TeacherProfile.introVideoUrl
  # on approval (the teacher can hide it again via updateTeacherProfile).
  videoUrl: String
  status: TeacherApplicationStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
  user: User
}

input TeacherApplicationInput {
  # Updates the applicant's UserProfile.displayName when provided - the
  # name that ultimately appears on their public teacher profile.
  fullName: String
  headline: String
  bio: String
  instruments: [String!]
  experienceYears: Int
  address: String
  # Required - applyForTeacher rejects an application without one, or from
  # someone under 18.
  birthdate: DateTime
  gender: String
  motivation: String
  cvUrl: String
  audioSampleUrl: String
  documentUrls: [String!]
  imageUrl: String
  # Required - a YouTube link (watch/share/shorts URL or bare video id).
  videoUrl: String
}

