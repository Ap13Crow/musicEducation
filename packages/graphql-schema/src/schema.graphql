  startTime: String
  endTime: String
}

enum UnavailabilityLabel {
  UNAVAILABLE
  PRIVATE_APPOINTMENT
  HOLIDAY
  VACATION
  OTHER_UNAVAILABLE
}

# A teacher-declared block overriding TeacherAvailability for a specific
# range (Phase 3, scoped: one-time only, no recurrence yet). `note` is
# private - resolved to null for anyone but the teacher/an admin; `label`
# is the only thing a student or guest ever sees.
type TeacherUnavailability {
  id: ID!
  teacherProfileId: ID!
  startsAt: DateTime!
  endsAt: DateTime!
  label: UnavailabilityLabel!
  note: String
}

# A user's own private appointment - visible only to its owner via
# myAppointments, never resolved for anyone else.
type PersonalAppointment {
  id: ID!
  title: String!
  startsAt: DateTime!
  endsAt: DateTime!
  notes: String
}

# Phase 6 (scoped) - see the ExternalCalendarConnection model comment in
# packages/database/prisma/schema.prisma and
# apps/api/src/lib/externalCalendar.ts for why GOOGLE/MICROSOFT sync is a
# schema contract only right now: connectExternalCalendar always rejects
# with NOT_CONFIGURED (no OAuth client credentials exist in this
# deployment). Apple's calendar sync is the working feature instead - a
# provider-agnostic ICS subscription feed (Query.myCalendarFeedToken /
# Mutation.rotateCalendarFeedToken), which Apple Calendar, Google Calendar,
# and Outlook can all subscribe to without any OAuth.
enum ExternalCalendarProvider {
  GOOGLE
  MICROSOFT
}

enum ExternalCalendarConnectionStatus {
  CONNECTED
  ERROR
}

type ExternalCalendarConnection {
  id: ID!
  provider: ExternalCalendarProvider!
  status: ExternalCalendarConnectionStatus!
  externalAccountEmail: String
  lastSyncedAt: DateTime
  createdAt: DateTime!
}

