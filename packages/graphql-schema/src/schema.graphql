type TeacherProfile {
  id: ID!
  userId: ID!
  headline: String
  teachingBio: String
  hourlyRate: Float
  currency: String!
  instruments: [String!]!
  specializations: [String!]!
  teachingFormats: [String!]!
  isAvailable: Boolean!
  avgRating: Float!
  totalReviews: Int!
  yearsExperience: Int
  locationCity: String
  locationCountry: String
  calendlyUsername: String
  # Public professional photo shown on the teacher directory/profile to
  # guests and everyone else - set via requestUploadUrl(purpose:
  # TEACHER_PROFILE_IMAGE) + updateTeacherProfile. Deliberately separate from
  # the account avatar (User -> UserProfile.avatarUrl, private/account-only),
  # so it's never silently reused as the public image. Null until the
  # teacher uploads one.
  publicImageUrl: String
  # YouTube presentation/performance video copied from the approved
  # application - null once the teacher hides it via updateTeacherProfile
  # even though the underlying link is kept, so introVideoUrl is null
  # whenever there's nothing to show regardless of visibility state.
  introVideoUrl: String
  introVideoVisible: Boolean!
  certifications: [TeacherCertification!]
  availability: [TeacherAvailability!]
  # Date this teacher's profile was first provisioned (approval time) -
  # "years/months teaching on MyMusic.Coach" is calculated client-side from
  # this, never from self-reported yearsExperience (pre-platform history).
  memberSince: DateTime!
  # A distinct student is a user with at least one CONFIRMED or COMPLETED
  # booking with this teacher (see apps/api/src/lib/loaders.ts) - never
  # exposes which students, only the count.
  distinctStudentCount: Int!
  # Published courses this teacher has authored - there is no separate
  # "resource" model in the schema, so this counts what actually exists
  # rather than a metric with nothing behind it.
  publishedResourceCount: Int!
  # Stripe Connect payout status. Only resolved for the teacher themself or an
  # admin — null for anyone else viewing a public teacher profile.
  stripeAccountId: String
  stripePayoutsEnabled: Boolean
  # Booking governance (Phase 4) - see apps/api/src/lib/bookingPolicy.ts for
  # the exact leadDays/cancellationDays semantics. Publicly visible (a
  # student deciding whether to book needs to know the lead time), except
  # the approval-mode toggles, which are the teacher's own operational
  # setting and only resolved for the teacher/an admin.
  leadDays: Int!
  cancellationDays: Int!
  autoApproveNewStudents: Boolean
  autoApproveRecurringStudents: Boolean
  instrumentCapacities: [TeacherInstrumentCapacity!]!
  user: User
}

# maxActiveStudents: null = unlimited, an explicit 0 is a real (zero)
# capacity - never conflated. remainingCapacity is the honest, non-invented
# derived value shown publicly (never raw student counts/identities to a
# guest - see the resolver).
type TeacherInstrumentCapacity {
  id: ID!
  instrument: String!
  maxActiveStudents: Int
  activeStudentCount: Int!
  remainingCapacity: Int
}

