# What a requestUploadUrl call is for - the resolver uses this to pick the
# storage key prefix, the allowed content types, and the authorization rule
# (a signed-in caller may upload their own teacher-application files; only a
# course's teacher/an admin may upload a COURSE_SLIDE).
enum UploadPurpose {
  TEACHER_APPLICATION_CV
  TEACHER_APPLICATION_AUDIO
  TEACHER_APPLICATION_DOCUMENT
  COURSE_SLIDE
  TEACHER_PROFILE_IMAGE
}

type UploadTarget {
  # Presigned PUT URL, valid briefly - PUT the file's raw bytes here with
  # the same contentType requested, then use fileUrl in the owning mutation.
  uploadUrl: String!
  fileUrl: String!
  key: String!
}

enum QuizQuestionType {
  SINGLE_CHOICE
  MULTIPLE_CHOICE
}

enum QuizFeedbackMode {
  IMMEDIATE
  AT_END
}

enum BookingStatus {
  # Also doubles as "awaiting the teacher's manual approval" - see
  # TeacherProfile.autoApproveNewStudents/autoApproveRecurringStudents and
  # Booking.holdExpiresAt.
  PENDING
  CONFIRMED
  CANCELLED
  COMPLETED
  NO_SHOW
}

enum BookingFormat {
  IN_PERSON
  ONLINE
  HYBRID
}

enum EventType {
  MASTERCLASS
