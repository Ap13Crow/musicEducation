# ── Enums ──────────────────────────────────

enum Role {
  GUEST
  STUDENT
  TEACHER
  ADMIN
}

enum SkillLevel {
  BEGINNER
  ELEMENTARY
  INTERMEDIATE
  ADVANCED
  PROFESSIONAL
}

enum CourseStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

enum LessonContentType {
  VIDEO
  YOUTUBE
  AUDIO
}

enum QuizQuestionType {
  SINGLE_CHOICE
  MULTIPLE_CHOICE
}

enum QuizFeedbackMode {
  IMMEDIATE
  AT_END
}

enum BookingStatus {
  PENDING
  CONFIRMED
  CANCELLED
  COMPLETED
  NO_SHOW
}

enum BookingFormat {
  IN_PERSON
  ONLINE
  HYBRID
}

enum EventType {
  MASTERCLASS
  WORKSHOP
  CONCERT
  COMPETITION
  OPEN_MIC
  LECTURE
  OTHER
}

enum EventFormat {
  IN_PERSON
  ONLINE
  HYBRID
}

enum PaymentStatus {
  PENDING
  SUCCEEDED
