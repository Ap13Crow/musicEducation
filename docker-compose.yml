# ============================================================
# My Music Coach — Full Stack (docker compose up)
# ============================================================
# Only the gateway (Caddy) is exposed on 0.0.0.0.
# All other services listen on the internal Docker network.
# ============================================================

services:

  # ── Gateway / Reverse Proxy (Caddy) ────────────────────
  gateway:
    image: caddy:2.8-alpine
    container_name: mymusic_coach_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── PostgreSQL (main platform DB) ────────────────────
  postgres-main:
    image: postgres:16-alpine
    container_name: mymusic_coach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mymusic_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mymusic_coach_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-mymusic_coach}
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mymusic_coach}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (main platform cache / pub-sub) ──────────────────
  redis-main:
    image: redis:7-alpine
    container_name: mymusic_coach_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_pw}
    volumes:
      - redis_main_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_pw}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak (central identity provider) ──────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: mymusic_coach_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_pw}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-main:5432/${POSTGRES_DB:-mymusic_coach}
      KC_DB_USERNAME: ${POSTGRES_USER:-mymusic_coach}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-mymusic_coach_dev_pw}
      KC_HOSTNAME: auth.mymusic-coach.test
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./docker/keycloak/theme/mymusiccoach:/opt/keycloak/themes/mymusiccoach
    expose:
      - "8080"
    depends_on:
      postgres-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── GraphQL API ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mymusic_coach_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mymusic_coach:mymusic_coach_dev_pw@postgres-main:5432/mymusic_coach}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_pw}@redis-main:6379
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_IN_PRODUCTION_PLEASE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ZOOM_API_KEY: ${ZOOM_API_KEY:-}
      ZOOM_API_SECRET: ${ZOOM_API_SECRET:-}
      # ── Keycloak (for admin role sync) ────────────────
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/mymusic-coach}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_REALM:-mymusic-coach}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_pw}
      # ── General ──────────────────────────
      FRONTEND_URL: ${FRONTEND_URL:-http://app.mymusic-coach.test}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://app.mymusic-coach.test}
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
    expose:
      - "4000"
    depends_on:
      postgres-main:
        condition: service_healthy
      redis-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Next.js Web App ────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL}
        NEXT_PUBLIC_GRAPHQL_WS_URL: ${NEXT_PUBLIC_GRAPHQL_WS_URL}
        NEXT_PUBLIC_ENABLE_LIVE_API: ${NEXT_PUBLIC_ENABLE_LIVE_API}
        NEXT_PUBLIC_KEYCLOAK_ISSUER: ${NEXT_PUBLIC_KEYCLOAK_ISSUER}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: mymusic_coach_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: /api/graphql
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://app.mymusic-coach.test}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-CHANGE_THIS_IN_PRODUCTION}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mymusic-coach-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/mymusic-coach}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  # ── MCP Server (AI) ─────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    container_name: mymusic_coach_mcp
    restart: unless-stopped
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://mymusic_coach:mymusic_coach_dev_pw@postgres-main:5432/mymusic_coach}
      MCP_PORT: 3100
    expose:
      - "3100"
    depends_on:
      postgres-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3100/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── MinIO (object storage) ──────────────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: mymusic_coach_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_pw}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

# ── Volumes ──────────────────────────────────────
volumes:
  caddy_data:
  caddy_config:
  postgres_main_data:
  redis_main_data:
  minio_data:

# ── Network ──────────────────────────────────────
networks:
  default:
    name: mymusic_coach_network
