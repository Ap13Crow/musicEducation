apiVersion: batch/v1
kind: Job
metadata:
  name: application-identity-schema
  labels:
    app.kubernetes.io/name: application-identity-schema
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: mymusic-coach
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-identity-schema
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: mymusic-coach
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:17.10-alpine3.23
          command: [sh, -ec]
          args:
            - |
              psql --set=ON_ERROR_STOP=1 --file=/schema/001-identity.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/002-practice.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/003-profile-contract.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/004-native-pillars.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/005-external-events.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/006-community-commerce.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/007-stripe-connect.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/008-teacher-applications.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/009-lesson-content-type.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/010-lesson-quizzes.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/011-xp-awards.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/012-assessment-answer-unique.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/013-assessment-question-seed.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/014-external-event-classification.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/015-teacher-application-address-birthdate.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/016-object-storage-uploads.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/017-teacher-application-richer.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/018-payment-provider-ref-unique.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/019-payment-confirmation-email-marker.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/020-teacher-profile-public-image.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/021-mail-outbox.sql
              psql --set=ON_ERROR_STOP=1 --file=/schema/022-teacher-teaching-formats.sql
          envFrom:
            - secretRef:
                name: postgres-mymusiccoach
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      volumes:
        - name: schema
          configMap:
            name: application-identity-schema
        - name: postgres-ca
          configMap:
            name: postgres-ca
        - name: temporary
          emptyDir: {}
