apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: &workerLabels
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: application-worker
    app.kubernetes.io/part-of: mymusic-coach
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels: *workerLabels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: mymusiccoach/worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4100
          envFrom:
            - secretRef:
                name: postgres-mymusiccoach
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4100'
            # Realm/server URL the keycloak-user-sync job derives its Keycloak
            # admin-API calls from (see apps/worker/src/lib/keycloakAdmin.ts) -
            # same value api.yaml uses to verify SSO tokens, patched to the
            # production hostname the same way in deploy/overlays/prod.
            - name: KEYCLOAK_ISSUER
              value: https://auth-dev.mymusic.coach/realms/mymusic-coach
            # The Keycloak Operator's own initial superadmin (master realm) -
            # this Secret is created automatically for every Keycloak CR, so
            # no separate service-account client/permissions setup is needed.
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: TICKETMASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: TICKETMASTER_API_KEY
                  optional: true
            # Classictic affiliate discovery (apps/worker/src/discovery/classictic.ts,
            # classictic-ingest job) - same optional/absent-disables-cleanly shape
            # as Ticketmaster above.
            - name: CLASSICTIC_AFFILIATE_ID
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: CLASSICTIC_AFFILIATE_ID
                  optional: true
            # DeepSeek (preferred) / OpenAI fallback for the event-classification
            # job (see apps/worker/src/jobs/event-classification.ts) - absent,
            # aiChat() returns null and the job skips classification this run.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: DEEPSEEK_API_URL
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: DEEPSEEK_API_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: OPENAI_API_KEY
                  optional: true
            # This worker is the only sender for MailOutboxMessage rows
            # (apps/worker/src/jobs/mail-dispatch.ts, apps/worker/src/lib/
            # mailer.ts) - without these, mailConfigured() is always false
            # and every queued message retries until it dead-letters,
            # regardless of api.yaml having its own copy of the same six
            # keys (that copy only covers the synchronous course/event
            # purchase-confirmation path in apps/api/src/lib/mailer.ts,
            # a separate sender).
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_FROM
                  optional: true
            - name: SMTP_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_FROM_NAME
                  optional: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:4100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      volumes:
        - name: postgres-ca
          configMap:
            name: postgres-ca
        - name: temporary
          emptyDir: {}
