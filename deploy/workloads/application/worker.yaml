apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: &workerLabels
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: application-worker
    app.kubernetes.io/part-of: mymusic-coach
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels: *workerLabels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: mymusiccoach/worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4100
          envFrom:
            - secretRef:
                name: postgres-mymusiccoach
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4100'
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: TICKETMASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: TICKETMASTER_API_KEY
                  optional: true
            # DeepSeek (preferred) / OpenAI fallback for the event-classification
            # job (see apps/worker/src/jobs/event-classification.ts) - absent,
            # aiChat() returns null and the job skips classification this run.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: DEEPSEEK_API_URL
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: DEEPSEEK_API_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:4100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      volumes:
        - name: postgres-ca
          configMap:
            name: postgres-ca
        - name: temporary
          emptyDir: {}
