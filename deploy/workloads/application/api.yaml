apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: &apiLabels
    app.kubernetes.io/name: api
    app.kubernetes.io/component: application-api
    app.kubernetes.io/part-of: mymusic-coach
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels: *apiLabels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mymusiccoach/api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: postgres-mymusiccoach
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '4000'
            - name: CORS_ORIGIN
              value: http://web:3000
            # createCheckoutSession builds Stripe's success_url/cancel_url from
            # this - unset here, it resolved to "undefined/payment/success..."
            # and Stripe rejected the whole session with "Invalid URL: An
            # explicit scheme (such as https) must be provided."
            - name: FRONTEND_URL
              value: https://dev.mymusic.coach
            - name: KEYCLOAK_ISSUER
              value: https://auth-dev.mymusic.coach/realms/mymusic-coach
            - name: KEYCLOAK_CLIENT_ID
              value: mymusic-coach-web
            # The Keycloak Operator's own initial superadmin (master realm),
            # used only by adminDeactivateUser (see
            # apps/api/src/lib/keycloakAdmin.ts) to delete an identity - this
            # Secret is created automatically for every Keycloak CR, so no
            # separate service-account client/permissions setup is needed.
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-initial-admin
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-runtime
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_SECRET_KEY
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            # Separate signing secret for the v2 thin-event Connect
            # requirements webhook (/webhooks/stripe-v2) - absent, that
            # route stays disabled but checkout/payouts still work off the
            # two keys above.
            - name: STRIPE_WEBHOOK_SECRET_V2
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: STRIPE_WEBHOOK_SECRET_V2
                  optional: true
            - name: TICKETMASTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: TICKETMASTER_API_KEY
                  optional: true
            # DeepSeek (preferred) / OpenAI fallback for AI-generated assessment
            # reports (see apps/api/src/lib/ai.ts) - absent, aiChat() returns
            # null and callers fall back to deterministic text.
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: DEEPSEEK_API_KEY
                  optional: true
            - name: DEEPSEEK_API_URL
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: DEEPSEEK_API_URL
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: OPENAI_API_KEY
                  optional: true
            # S3-compatible object storage (DigitalOcean Spaces) for course
            # slide/PDF and teacher-application document uploads.
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: S3_ENDPOINT
                  optional: true
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: S3_REGION
                  optional: true
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: S3_BUCKET
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: S3_ACCESS_KEY_ID
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: S3_SECRET_ACCESS_KEY
                  optional: true
            # Transactional email via the Google Workspace SMTP relay (see
            # apps/api/src/lib/mailer.ts) - absent, sendMail() no-ops and
            # bookings/purchases still succeed without a notification.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_FROM
                  optional: true
            - name: SMTP_FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: application-integrations
                  key: SMTP_FROM_NAME
                  optional: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      volumes:
        - name: postgres-ca
          configMap:
            name: postgres-ca
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mymusic-coach
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 4000
      targetPort: http
