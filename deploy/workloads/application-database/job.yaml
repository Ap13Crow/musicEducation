apiVersion: batch/v1
kind: Job
metadata:
  name: application-identity-schema
  labels:
    app.kubernetes.io/name: application-identity-schema
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: mymusic-coach
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-identity-schema
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: mymusic-coach
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:17.10-alpine3.23
          command: [sh, -ec]
          args:
            - |
              for attempt in $(seq 1 60); do
                if psql --no-password --set=ON_ERROR_STOP=1 --command='SELECT 1' >/dev/null 2>&1; then
                  echo 'PostgreSQL service is accepting authenticated TLS connections.'
                  break
                fi
                if [ "$attempt" -eq 60 ]; then
                  echo 'PostgreSQL service did not become reachable within 120 seconds.' >&2
                  exit 1
                fi
                echo "Waiting for PostgreSQL service ($attempt/60)..."
                sleep 2
              done

              migration_count=0
              for migration in /schema/[0-9][0-9][0-9]-*.sql; do
                if [ ! -f "$migration" ]; then
                  echo 'No numbered application schema migrations were mounted.' >&2
                  exit 1
                fi
                echo "Applying $(basename "$migration")..."
                psql --set=ON_ERROR_STOP=1 --file="$migration"
                migration_count=$((migration_count + 1))
              done
              echo "Applied $migration_count application schema migrations."
          envFrom:
            - secretRef:
                name: postgres-mymusiccoach
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
            - name: temporary
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
      volumes:
        - name: schema
          configMap:
            name: application-identity-schema
        - name: postgres-ca
          configMap:
            name: postgres-ca
        - name: temporary
          emptyDir: {}
