apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Garage: local S3-compatible store for the Library media copies (scores,
# page scans, recordings), so the Library never depends on a source being
# reachable. Secrets (garage-secrets, library-media-s3) are created by
# deploy/scripts/bootstrap-library-storage.sh, never committed.
namespace: mymusic-coach
resources:
  - persistent-volume.yaml
  - configmap.yaml
  - service.yaml
  - statefulset.yaml
  - network-policy.yaml
