apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: mymusic-coach
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: mymusic-coach
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: database-backup
            app.kubernetes.io/part-of: mymusic-coach
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:17.12-alpine3.23
              imagePullPolicy: IfNotPresent
              command: [sh, -ec]
              args:
                - |
                  # k3s' network-policy controller admits a new pod's IP a
                  # second or two after it starts; until then Postgres
                  # refuses the connection. Wait for it instead of failing.
                  tries=0
                  until pg_isready --timeout=2 >/dev/null 2>&1; do
                    tries=$((tries + 1))
                    if [ "$tries" -ge 30 ]; then
                      echo "postgres not reachable after 60s" >&2
                      exit 1
                    fi
                    sleep 2
                  done
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  for database in mymusiccoach keycloak; do
                    target="/backups/${database}-${stamp}.dump"
                    pg_dump --format=custom --file="${target}.partial" "$database"
                    # A dump only counts once pg_restore can read its table of contents.
                    pg_restore --list "${target}.partial" >/dev/null
                    mv "${target}.partial" "$target"
                    echo "backup ok: $target ($(du -h "$target" | cut -f1))"
                  done
                  find /backups -type f -name '*.partial' -delete
                  find /backups -type f -name '*.dump' -size 0 -delete
                  find /backups -type f -name '*.dump' -mtime +14 -delete
              env:
                - name: PGHOST
                  value: postgres.mymusic-coach.svc.cluster.local
                - name: PGPORT
                  value: '5432'
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin
                      key: POSTGRES_PASSWORD
                - name: PGSSLMODE
                  value: verify-full
                - name: PGSSLROOTCERT
                  value: /etc/postgres-ca/ca.crt
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: postgres-ca
                  mountPath: /etc/postgres-ca
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: postgres-ca
              configMap:
                name: postgres-ca
            - name: temporary
              emptyDir: {}
