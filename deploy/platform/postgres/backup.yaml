apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: mymusic-coach
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: database-backup
    app.kubernetes.io/part-of: mymusic-coach
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: database-backup
            app.kubernetes.io/part-of: mymusic-coach
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: postgres:17.10-alpine3.23
              imagePullPolicy: IfNotPresent
              command: [sh, -ec]
              args:
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  for database in mymusiccoach keycloak; do
                    pg_dump --format=custom --file="/backups/${database}-${stamp}.dump" "$database"
                  done
                  find /backups -type f -name '*.dump' -mtime +14 -delete
              env:
                - name: PGHOST
                  value: postgres.mymusic-coach.svc.cluster.local
                - name: PGPORT
                  value: '5432'
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-admin
                      key: POSTGRES_PASSWORD
                - name: PGSSLMODE
                  value: verify-full
                - name: PGSSLROOTCERT
                  value: /etc/postgres-ca/ca.crt
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ['ALL']
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: postgres-ca
                  mountPath: /etc/postgres-ca
                  readOnly: true
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
            - name: postgres-ca
              configMap:
                name: postgres-ca
            - name: temporary
              emptyDir: {}
