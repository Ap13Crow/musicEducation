apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: '1'
        memory: 1Gi
      max:
        cpu: '4'
        memory: 8Gi
    - type: PersistentVolumeClaim
      max:
        storage: 200Gi
