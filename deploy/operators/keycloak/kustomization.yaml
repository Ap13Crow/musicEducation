apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The official operator watches the namespace where it is installed. Keep the
# version pinned so Keycloak upgrades remain deliberate, reviewable changes.
namespace: mymusic-coach
resources:
  - github.com/keycloak/keycloak-k8s-resources/kubernetes?ref=26.7.0

# The upstream Kustomization hard-codes its ClusterRoleBinding subject to the
# default `keycloak` namespace. Point that subject at this installation.
patches:
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: keycloak-operator-clusterrole-binding
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: mymusic-coach
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keycloak-operator
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: keycloak-operator
      spec:
        template:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: keycloak-operator
                imagePullPolicy: IfNotPresent
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ['ALL']
