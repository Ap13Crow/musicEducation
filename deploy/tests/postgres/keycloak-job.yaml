apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-keycloak-smoke
  labels:
    app.kubernetes.io/name: postgres-keycloak-smoke
    app.kubernetes.io/component: database-test
    app.kubernetes.io/part-of: mymusic-coach
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-keycloak-smoke
        app.kubernetes.io/component: database-test
        app.kubernetes.io/part-of: mymusic-coach
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:17.10-alpine3.24
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: postgres-keycloak
          command:
            - /bin/sh
            - -ec
            - |
              psql -v ON_ERROR_STOP=1 <<'SQL'
              \conninfo
              SELECT current_database() AS database, current_user AS database_user;
              BEGIN;
              CREATE TABLE public.deployment_permission_probe (id integer PRIMARY KEY);
              ROLLBACK;
              SQL
              if PGDATABASE=mymusiccoach psql -v ON_ERROR_STOP=1 -c 'SELECT 1'; then
                echo "keycloak_app must not connect to the mymusiccoach database." >&2
                exit 1
              fi
              echo "Cross-database isolation is enforced for keycloak_app."
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/postgres-ca
              readOnly: true
      volumes:
        - name: postgres-ca
          configMap:
            name: postgres-ca
